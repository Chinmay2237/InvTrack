name: invtrack
description: InvTrack - Commercial Grade Inventory & Asset Assignment Studio
publish_to: 'none'
version: 2.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.1.1
  google_fonts: ^6.3.3
  csv: ^5.1.1
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  uuid: ^4.4.0
  fl_chart: ^1.1.1
  path_provider: ^2.1.3
  flutter_riverpod: any
  riverpod_annotation: any
  drift: any
  drift_flutter: any
  sqlite3_flutter_libs: any
