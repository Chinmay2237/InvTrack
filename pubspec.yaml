name: myapp
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  go_router: ^14.1.1
  provider: ^6.1.2
  google_fonts: ^6.3.3
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  csv: ^5.1.1
  shared_preferences: ^2.5.3
  flutter_staggered_animations: ^1.1.1
  intl: ^0.19.0
  uuid: ^4.4.0
  shimmer: ^3.0.0
  http: ^1.2.1
  fl_chart: ^1.1.1
  carousel_slider: ^4.2.1
  dotted_border: ^3.1.0
  path_provider: ^2.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - lib/data/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
